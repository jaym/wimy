# fuzzel configuration matching the wimy/waybar theme.
# Copy to ~/.config/fuzzel/fuzzel.ini
#
# Layout (anchor, width, lines) is set via wimy's `launcher`/`menu`
# config strings; command-line flags override these values.

[main]
font=sans-serif:size=11
prompt="> "
line-height=22
horizontal-pad=16
inner-pad=6
vertical-pad=8

[border]
width=0
radius=0

# Same palette as contrib/waybar/style.css (catppuccin-macchiato-ish).
# All values are RRGGBBAA hex.
[colors]
background=24273aff
text=cad3f5ff
prompt=8aadf4ff
placeholder=8087a2ff
input=cad3f5ff
match=f5a97fff
selection=363a4fff
selection-text=cad3f5ff
selection-match=f5a97fff
counter=8087a2ff
border=24273aff
